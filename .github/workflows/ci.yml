name: CI

on:
  push:
  pull_request:
  release:
    types: [published]
  # A dry run of both release builds (no release, nothing attached): run it
  # from the Actions tab before tagging, so a broken build is found before a
  # release goes public with only half its files.
  workflow_dispatch:

# The ffmpeg the app ships with, and the one the smoke tests run against.
# The FULL build, not essentials: essentials lacks libsvtav1, which the app
# needs for CPU AV1 encoding. Pinned to 7.1.1: the version the app was tested
# against, and ffmpeg 8.x NVENC requires NVIDIA driver 610+, which would
# silently break GPU encoding for most users. Bump deliberately, re-test NVENC
# on real hardware, and update the SHA256 when you do.
env:
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-full_build.zip
  FFMPEG_SHA256: D760E1B3574402ED18B4865851F87D87E73965A982E6453212DF8621FED1C508
  # gifsicle powers the lossy GIF option; Windows builds are the ones the
  # official gifsicle homepage links to.
  GIFSICLE_URL: https://eternallybored.org/misc/gifsicle/releases/gifsicle-1.95-win64.zip
  GIFSICLE_SHA256: 7E47DD0BFD5EE47F911464C57FAEED89A8709A7625DD1C449B16579889539EE8

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Tool versions are pinned so a new ruff rule or pytest release can't
      # turn an unchanged commit red; bump them deliberately.
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.15.22
      - name: Lint
        run: ruff check .
      - name: Fetch pinned ffmpeg + gifsicle (for the smoke tests)
        shell: pwsh
        run: |
          curl.exe -sL -o ffmpeg.zip $env:FFMPEG_URL
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($actual -ne $env:FFMPEG_SHA256) {
            throw "ffmpeg checksum mismatch: expected $env:FFMPEG_SHA256, got $actual"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          curl.exe -sL -o gifsicle.zip $env:GIFSICLE_URL
          $actual = (Get-FileHash gifsicle.zip -Algorithm SHA256).Hash
          if ($actual -ne $env:GIFSICLE_SHA256) {
            throw "gifsicle checksum mismatch: expected $env:GIFSICLE_SHA256, got $actual"
          }
          Expand-Archive gifsicle.zip -DestinationPath gifsicle_tmp
          Copy-Item (Get-ChildItem gifsicle_tmp -Recurse -Filter gifsicle.exe | Select-Object -First 1).FullName $bin
      - run: pytest -q

  test-linux:
    # The same suite on Linux, against the same pinned tools the AppImage
    # bundles (build.sh is the single source of their URLs and hashes).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.15.22
      - name: Lint
        run: ruff check .
      - name: Fetch pinned ffmpeg + build gifsicle (for the smoke tests)
        run: |
          ./build.sh --tools-only
          echo "$PWD/build-linux/tools" >> "$GITHUB_PATH"
      - run: pytest -q

  build:
    # Builds the self contained exe and attaches it to the GitHub release.
    needs: [test, test-linux]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt pyinstaller==6.21.0
      - name: Fetch pinned ffmpeg + gifsicle (bundled into the exe)
        shell: pwsh
        run: |
          # These artifacts ship inside the exe, so their integrity is
          # verified against the pinned hashes before anything is bundled.
          curl.exe -sL -o ffmpeg.zip $env:FFMPEG_URL
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($actual -ne $env:FFMPEG_SHA256) {
            throw "ffmpeg checksum mismatch: expected $env:FFMPEG_SHA256, got $actual"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          curl.exe -sL -o gifsicle.zip $env:GIFSICLE_URL
          $actual = (Get-FileHash gifsicle.zip -Algorithm SHA256).Hash
          if ($actual -ne $env:GIFSICLE_SHA256) {
            throw "gifsicle checksum mismatch: expected $env:GIFSICLE_SHA256, got $actual"
          }
          Expand-Archive gifsicle.zip -DestinationPath gifsicle_tmp
          Copy-Item (Get-ChildItem gifsicle_tmp -Recurse -Filter gifsicle.exe | Select-Object -First 1).FullName $bin
      - name: Build exe
        shell: pwsh
        run: ./build.ps1
      - name: Attach exe to release
        if: github.event_name == 'release'
        # Third party action with write access to releases: pinned to the
        # v2.6.2 commit, not a movable tag, so a hijacked tag can't swap the
        # exe everyone's in-app updater downloads.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/Laxy Toolbox.exe

  build-linux:
    # Builds the AppImage and attaches it to the same release. Ubuntu 22.04
    # on purpose: an AppImage needs at least the glibc it was built against,
    # so building on an older distro is what lets it run on most of them.
    needs: [test, test-linux]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt pyinstaller==6.21.0
      - name: Build AppImage
        run: ./build.sh
      - name: Self test (bundled ffmpeg + drag-and-drop load)
        # Fails the release if the AppImage can't find its own tools.
        run: |
          xvfb-run -a dist/Laxy.Toolbox-x86_64.AppImage --appimage-extract-and-run --selftest selftest.json
          cat selftest.json
          python -c "import json,sys; r=json.load(open('selftest.json')); \
            ok = r['frozen'] and 'ffmpeg version' in r['ffmpeg_version'] \
                 and 'ffprobe version' in r['ffprobe_version'] \
                 and not str(r['tkdnd']).startswith('ERROR'); sys.exit(0 if ok else 1)"
      - name: Attach AppImage to release
        if: github.event_name == 'release'
        # Same pinned commit as the Windows job (v2.6.2).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/Laxy.Toolbox-x86_64.AppImage
